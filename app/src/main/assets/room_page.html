<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room {{ROOM_ID}} Controls</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 font-sans text-slate-800 relative overflow-hidden">

<div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 border border-slate-200">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Room {{ROOM_ID}}</h2>
        <p class="text-slate-500 mt-2 font-medium">Select your required assistance level</p>
    </div>

    <div class="space-y-4">
        <button onclick="sendStatus(1)" class="w-full py-4 px-6 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold rounded-xl shadow-sm transition-all transform active:scale-95 text-lg">
            Call Nurse
        </button>
        <button onclick="sendStatus(2)" class="w-full py-4 px-6 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl shadow-sm transition-all transform active:scale-95 text-lg">
            Need Assistance
        </button>
        <button onclick="sendStatus(3)" class="w-full py-4 px-6 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-sm transition-all transform active:scale-95 text-lg">
            Care Required
        </button>

        <div class="pt-4 border-t border-slate-100 mt-4">
            <button onclick="sendStatus(4)" class="w-full py-5 px-6 bg-red-700 hover:bg-red-800 text-white font-black rounded-xl shadow-md transition-all transform active:scale-95 text-2xl uppercase tracking-wider animate-pulse">
                EMERGENCY
            </button>
        </div>
    </div>

    <div class="mt-8">
        <button onclick="sendStatus(0)" class="w-full py-4 px-6 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-sm transition-all transform active:scale-95 text-lg">
            Mark as Resolved (I'm OK)
        </button>
    </div>
</div>

<div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-white font-semibold shadow-2xl transition-all duration-500 opacity-0 translate-y-10 pointer-events-none z-50 flex items-center space-x-2">
    <span id="toastMessage">Status Updated!</span>
</div>

<script>
    // Custom Toast Function
    function showToast(message, isSuccess) {
        const toast = document.getElementById('toast');
        const msgSpan = document.getElementById('toastMessage');

        msgSpan.textContent = message;

        // Set colors based on success/fail
        if (isSuccess) {
            toast.className = "fixed bottom-8 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-white font-semibold shadow-2xl transition-all duration-500 z-50 bg-emerald-600 opacity-100 translate-y-0";
        } else {
            toast.className = "fixed bottom-8 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-white font-semibold shadow-2xl transition-all duration-500 z-50 bg-red-600 opacity-100 translate-y-0";
        }

        // Hide after 5 seconds
        setTimeout(() => {
            toast.classList.remove('opacity-100', 'translate-y-0');
            toast.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
        }, 5000);
    }

    function sendStatus(statusCode) {
        const payload = { roomId: "{{ROOM_ID}}", status: statusCode };

        fetch('/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (response.ok) showToast("Request sent to Nurse Station.", true);
            else showToast("Failed to send request.", false);
        })
        .catch(err => showToast("Network Error: " + err, false));
    }
</script>
</body>
</html>
